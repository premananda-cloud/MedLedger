<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLedger · View Record</title>
    <!-- same theme CSS as before -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>/* copy same styles from patient.html, adjust container width if needed */</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="Doctorlogin.html" class="back-home"><i class="fas fa-arrow-left"></i> Back</a>
            <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
        </div>
        <div class="logo-area">
            <i class="fas fa-shield-heart logo-icon"></i>
            <div class="logo-text">MedLedger</div>
            <div class="tagline">view patient record</div>
        </div>
        <h2><i class="fas fa-file-medical"></i> View Record</h2>
        <form id="viewForm" class="form">
            <div class="input-group">
                <label>Record ID</label>
                <input type="text" class="input-field" id="recordId" required>
            </div>
            <div class="input-group">
                <label>Patient User ID</label>
                <!-- FIX: Doctor enters patient user ID; the app auto-fetches the public key
                     from GET /users/{id}/public-key instead of requiring the doctor to manually
                     copy-paste a 130-char hex string (which was error-prone). -->
                <input type="number" class="input-field" id="patientUserId" placeholder="e.g. 3" required>
                <small id="keyStatus" style="color:#6ee7b7;"></small>
            </div>
            <button type="submit" class="btn-upload" id="viewBtn"><i class="fas fa-eye"></i> View Record</button>
        </form>
        <div class="footer">Praxis · blockchain‑powered health data</div>
    </div>
    <script>
        // Theme toggle and mouse spotlight (copy from other pages)
        // ... (same as before)

        const jwt = localStorage.getItem('medledger_jwt');
        if (!jwt) window.location.href = 'login.html';

        document.getElementById('viewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const recordId = document.getElementById('recordId').value.trim();
            const patientUserId = document.getElementById('patientUserId').value.trim();
            const viewBtn = document.getElementById('viewBtn');
            const keyStatus = document.getElementById('keyStatus');
            viewBtn.disabled = true;
            viewBtn.innerHTML = '<span class="loading"></span> Loading...';

            try {
                // FIX: Auto-fetch patient's public key via the dedicated endpoint
                // instead of requiring the doctor to copy-paste a 130-char hex string.
                keyStatus.textContent = 'Fetching patient public key...';
                const pkResponse = await fetch(`http://localhost:8000/users/${patientUserId}/public-key`, {
                    headers: { 'Authorization': `Bearer ${jwt}` }
                });
                if (!pkResponse.ok) {
                    throw new Error(`Could not fetch public key for patient ${patientUserId}`);
                }
                const pkData = await pkResponse.json();
                const patientKey = pkData.public_key_hex;
                keyStatus.textContent = '✅ Public key fetched';

                const response = await fetch(`http://localhost:8000/records/${recordId}/doctor-view`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${jwt}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ patient_public_key_hex: patientKey })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Access denied');
                }

                // The response is the file – we need to display it
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = response.headers.get('content-disposition')?.split('filename=')[1] || 'record';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                viewBtn.disabled = false;
                viewBtn.innerHTML = '<i class="fas fa-eye"></i> View Record';
            }
        });
    </script>
</body>
</html>
