<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLedger Architecture</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
            font-size: 14px;
        }
        
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
        
        .legend-text {
            font-size: 13px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 MedLedger Architecture</h1>
        <p class="subtitle">Patient-Controlled Healthcare Data Management</p>
        
        <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
            <!-- Background sections -->
            <rect x="20" y="20" width="960" height="150" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" rx="8"/>
            <text x="40" y="45" font-size="18" font-weight="bold" fill="#0369a1">PRESENTATION LAYER</text>
            <text x="40" y="65" font-size="12" fill="#0c4a6e">(React Web + Mobile)</text>
            
            <rect x="20" y="200" width="960" height="100" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
            <text x="40" y="225" font-size="18" font-weight="bold" fill="#92400e">API LAYER</text>
            <text x="40" y="245" font-size="12" fill="#78350f">(FastAPI + JWT + Crypto)</text>
            
            <rect x="20" y="340" width="450" height="220" fill="#dbeafe" stroke="#0284c7" stroke-width="2" rx="8"/>
            <text x="40" y="365" font-size="16" font-weight="bold" fill="#0c4a6e">BLOCKCHAIN LAYER</text>
            <text x="40" y="385" font-size="12" fill="#0c4a6e">(Immutable Audit Trail)</text>
            
            <rect x="530" y="340" width="450" height="220" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" rx="8"/>
            <text x="550" y="365" font-size="16" font-weight="bold" fill="#6b21a8">STORAGE LAYER</text>
            <text x="550" y="385" font-size="12" fill="#6b21a8">(Encrypted Records)</text>
            
            <!-- Presentation Layer Components -->
            <g>
                <rect x="50" y="75" width="130" height="70" fill="white" stroke="#0ea5e9" stroke-width="2" rx="6"/>
                <text x="65" y="100" font-size="13" font-weight="bold" fill="#0369a1">👤 PATIENT</text>
                <text x="65" y="120" font-size="11" fill="#0c4a6e">View Records</text>
                <text x="65" y="135" font-size="11" fill="#0c4a6e">Grant Access</text>
            </g>
            
            <g>
                <rect x="240" y="75" width="130" height="70" fill="white" stroke="#0ea5e9" stroke-width="2" rx="6"/>
                <text x="255" y="100" font-size="13" font-weight="bold" fill="#0369a1">🏥 DOCTOR</text>
                <text x="255" y="120" font-size="11" fill="#0c4a6e">Request Access</text>
                <text x="255" y="135" font-size="11" fill="#0c4a6e">View Records</text>
            </g>
            
            <g>
                <rect x="430" y="75" width="130" height="70" fill="white" stroke="#0ea5e9" stroke-width="2" rx="6"/>
                <text x="445" y="100" font-size="13" font-weight="bold" fill="#0369a1">🚫 ADMIN</text>
                <text x="445" y="120" font-size="11" fill="#dc2626">(Cannot Access)</text>
                <text x="445" y="135" font-size="11" fill="#dc2626">Math Prevents It</text>
            </g>
            
            <g>
                <rect x="620" y="75" width="130" height="70" fill="white" stroke="#0ea5e9" stroke-width="2" rx="6"/>
                <text x="635" y="100" font-size="13" font-weight="bold" fill="#0369a1">📊 RESEARCHER</text>
                <text x="635" y="120" font-size="11" fill="#0c4a6e">Access Anonymized</text>
                <text x="635" y="135" font-size="11" fill="#0c4a6e">Verified Data</text>
            </g>
            
            <g>
                <rect x="810" y="75" width="130" height="70" fill="white" stroke="#0ea5e9" stroke-width="2" rx="6"/>
                <text x="825" y="100" font-size="13" font-weight="bold" fill="#0369a1">⚖️ REGULATOR</text>
                <text x="825" y="120" font-size="11" fill="#0c4a6e">Audit Trail</text>
                <text x="825" y="135" font-size="11" fill="#0c4a6e">Verification</text>
            </g>
            
            <!-- API Layer Components -->
            <g>
                <rect x="50" y="215" width="200" height="60" fill="white" stroke="#f59e0b" stroke-width="2" rx="6"/>
                <text x="65" y="238" font-size="12" font-weight="bold" fill="#92400e">Registration</text>
                <text x="65" y="255" font-size="11" fill="#78350f">ECDSA P-256 Keypair</text>
                <text x="65" y="268" font-size="11" fill="#78350f">Shamir 3-of-5 Recovery</text>
            </g>
            
            <g>
                <rect x="320" y="215" width="200" height="60" fill="white" stroke="#f59e0b" stroke-width="2" rx="6"/>
                <text x="335" y="238" font-size="12" font-weight="bold" fill="#92400e">Access Control</text>
                <text x="335" y="255" font-size="11" fill="#78350f">Patient Signs Permission</text>
                <text x="335" y="268" font-size="11" fill="#78350f">Math Enforces Time Window</text>
            </g>
            
            <g>
                <rect x="590" y="215" width="200" height="60" fill="white" stroke="#f59e0b" stroke-width="2" rx="6"/>
                <text x="605" y="238" font-size="12" font-weight="bold" fill="#92400e">Encryption</text>
                <text x="605" y="255" font-size="11" fill="#78350f">AES-256-GCM Records</text>
                <text x="605" y="268" font-size="11" fill="#78350f">ECIES Key Exchange</text>
            </g>
            
            <g>
                <rect x="860" y="215" width="100" height="60" fill="white" stroke="#f59e0b" stroke-width="2" rx="6"/>
                <text x="875" y="238" font-size="12" font-weight="bold" fill="#92400e">Audit Logs</text>
                <text x="875" y="255" font-size="11" fill="#78350f">Signed Entries</text>
                <text x="875" y="268" font-size="11" fill="#78350f">Hash Chain</text>
            </g>
            
            <!-- Blockchain Layer -->
            <g>
                <rect x="40" y="390" width="200" height="150" fill="white" stroke="#0284c7" stroke-width="2" rx="6"/>
                <text x="55" y="413" font-size="12" font-weight="bold" fill="#0c4a6e">📋 IMMUTABLE LOG</text>
                <text x="55" y="433" font-size="11" fill="#0c4a6e">• Public Keys</text>
                <text x="55" y="450" font-size="11" fill="#0c4a6e">• Access Grants</text>
                <text x="55" y="467" font-size="11" fill="#0c4a6e">• Access Events</text>
                <text x="55" y="484" font-size="11" fill="#0c4a6e">• Revocations</text>
                <text x="55" y="520" font-size="10" fill="#0ea5e9" font-weight="bold">Cannot be deleted</text>
            </g>
            
            <g>
                <rect x="300" y="390" width="140" height="150" fill="white" stroke="#0284c7" stroke-width="2" rx="6"/>
                <text x="315" y="413" font-size="12" font-weight="bold" fill="#0c4a6e">🔗 CONSENSUS</text>
                <text x="315" y="433" font-size="11" fill="#0c4a6e">PBFT</text>
                <text x="315" y="450" font-size="11" fill="#0c4a6e">3-7 Validators</text>
                <text x="315" y="467" font-size="11" fill="#0c4a6e">Permissioned</text>
                <text x="315" y="520" font-size="10" fill="#0ea5e9" font-weight="bold">No single point of failure</text>
            </g>
            
            <!-- Storage Layer -->
            <g>
                <rect x="550" y="390" width="200" height="150" fill="white" stroke="#9333ea" stroke-width="2" rx="6"/>
                <text x="565" y="413" font-size="12" font-weight="bold" fill="#6b21a8">🔐 ENCRYPTED DATA</text>
                <text x="565" y="433" font-size="11" fill="#6b21a8">• Medical Records</text>
                <text x="565" y="450" font-size="11" fill="#6b21a8">• Lab Results</text>
                <text x="565" y="467" font-size="11" fill="#6b21a8">• Imaging (DICOM)</text>
                <text x="565" y="484" font-size="11" fill="#6b21a8">• Clinical Notes</text>
                <text x="565" y="520" font-size="10" fill="#9333ea" font-weight="bold">AES-256 encrypted at rest</text>
            </g>
            
            <g>
                <rect x="820" y="390" width="140" height="150" fill="white" stroke="#9333ea" stroke-width="2" rx="6"/>
                <text x="835" y="413" font-size="12" font-weight="bold" fill="#6b21a8">💾 STORAGE</text>
                <text x="835" y="433" font-size="11" fill="#6b21a8">PostgreSQL</text>
                <text x="835" y="450" font-size="11" fill="#6b21a8">IPFS / S3</text>
                <text x="835" y="467" font-size="11" fill="#6b21a8">Distributed</text>
                <text x="835" y="520" font-size="10" fill="#9333ea" font-weight="bold">Replicates for resilience</text>
            </g>
            
            <!-- Data Flow Arrows -->
            <!-- Patient to API -->
            <path d="M 115 145 L 115 215" stroke="#0ea5e9" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
            <text x="80" y="185" font-size="11" fill="#0ea5e9" font-weight="bold">Signs</text>
            
            <!-- Doctor to API -->
            <path d="M 305 145 L 305 215" stroke="#0ea5e9" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
            
            <!-- API to Blockchain -->
            <path d="M 150 275 L 150 390" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#arrowcyan)"/>
            <text x="120" y="340" font-size="11" fill="#0284c7" font-weight="bold">Audit Trail</text>
            
            <!-- API to Storage -->
            <path d="M 750 275 L 750 390" stroke="#9333ea" stroke-width="3" fill="none" marker-end="url(#arrowpurple)"/>
            <text x="700" y="340" font-size="11" fill="#9333ea" font-weight="bold">Encrypted Data</text>
            
            <!-- Arrow Markers -->
            <defs>
                <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#0ea5e9"/>
                </marker>
                <marker id="arrowcyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#0284c7"/>
                </marker>
                <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#9333ea"/>
                </marker>
            </defs>
            
            <!-- Key Insight Box -->
            <rect x="20" y="600" width="960" height="70" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="8"/>
            <text x="40" y="625" font-size="14" font-weight="bold" fill="#15803d">🔑 Key Insight:</text>
            <text x="40" y="645" font-size="12" fill="#166534">Patient owns private key. Admin cannot override. Math enforces time limits. Blockchain proves every access. Even if hospital DB is hacked, patient data remains encrypted and all actions remain auditable.</text>
        </svg>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box" style="background: #f0f9ff; border: 1px solid #0ea5e9;"></div>
                <span class="legend-text"><strong>Presentation:</strong> User interfaces</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #fef3c7; border: 1px solid #f59e0b;"></div>
                <span class="legend-text"><strong>API Layer:</strong> Business logic</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #dbeafe; border: 1px solid #0284c7;"></div>
                <span class="legend-text"><strong>Blockchain:</strong> Immutable audit</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #f3e8ff; border: 1px solid #9333ea;"></div>
                <span class="legend-text"><strong>Storage:</strong> Encrypted data</span>
            </div>
        </div>
    </div>
</body>
</html>
