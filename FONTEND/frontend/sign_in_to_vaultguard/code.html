<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>VaultGuard - Secure Login</title>

<style>

        }
        .vault-grid-bg {
            background-image:

                linear-gradient(to bottom, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glow-input:focus-within {
            box-shadow: 0 0 0 2px rgba(192, 193, 255, 0.2);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#00885d",
                        "surface-tint": "#c0c1ff",
                        "on-background": "#dae2fd",
                        "tertiary-fixed": "#6ffbbe",
                        "on-secondary-fixed": "#0d1c2d",
                        "surface": "#0b1326",
                        "surface-container-low": "#131b2e",
                        "secondary": "#b9c8de",
                        "on-surface-variant": "#c7c4d7",
                        "background": "#0b1326",
                        "tertiary-fixed-dim": "#4edea3",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-tertiary-container": "#000703",
                        "primary": "#c0c1ff",
                        "on-secondary-fixed-variant": "#39485a",
                        "primary-container": "#8083ff",
                        "surface-container-high": "#222a3d",
                        "inverse-primary": "#494bd6",
                        "on-secondary": "#233143",
                        "on-primary-fixed": "#07006c",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#b9c8de",
                        "inverse-on-surface": "#283044",
                        "surface-variant": "#2d3449",
                        "tertiary": "#4edea3",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-surface": "#dae2fd",
                        "on-secondary-container": "#a7b6cc",
                        "on-primary": "#1000a9",
                        "on-tertiary": "#003824",
                        "outline-variant": "#464554",
                        "secondary-fixed": "#d4e4fa",
                        "surface-dim": "#0b1326",
                        "secondary-container": "#39485a",
                        "surface-container-lowest": "#060e20",
                        "on-tertiary-fixed": "#002113",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#0d0096",
                        "surface-container": "#171f33",
                        "surface-bright": "#31394d",
                        "primary-fixed": "#e1e0ff",
                        "inverse-surface": "#dae2fd",
                        "surface-container-highest": "#2d3449",
                        "outline": "#908fa0",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "3xl": "64px",
                        "md": "16px",
                        "gutter": "24px",
                        "xs": "4px",
                        "base": "4px",
                        "lg": "24px",
                        "2xl": "48px",
                        "sm": "8px",
                        "margin": "32px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "label-md": ["Geist"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "mono-data": ["Geist"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Geist"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {

                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],

                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],

                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }

</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden relative">
<!-- Background Atmospheric Layer -->
<div class="absolute inset-0 vault-grid-bg opacity-30 pointer-events-none"></div>
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-tertiary/10 blur-[120px] rounded-full pointer-events-none"></div>
<!-- Login Container -->
<main class="flex-grow flex items-center justify-center p-md relative z-10">
<div class="w-full max-w-md">
<!-- Branding Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container border border-outline-variant rounded-xl mb-md shadow-lg">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-xs">VaultGuard</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure Enterprise Access Gateway</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-xl shadow-2xl relative overflow-hidden">
<!-- Subtle Gradient Overlay on Card -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-right from-primary to-tertiary opacity-50"></div>
<form class="space-y-lg" id="loginForm">
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Work Email Address</label>
<div class="relative group glow-input border border-outline-variant bg-surface-container-low rounded-lg transition-all">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full bg-transparent border-none py-3 pl-10 pr-md text-on-surface placeholder:text-outline/50 font-body-md focus:ring-0" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Access Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group glow-input border border-outline-variant bg-surface-container-low rounded-lg transition-all">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">key</span>
<input class="w-full bg-transparent border-none py-3 pl-10 pr-md text-on-surface placeholder:text-outline/50 font-body-md focus:ring-0" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Security Verification Placeholder -->
<div class="flex items-center space-x-sm bg-surface-variant/30 p-sm rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-tertiary text-[18px]">verified_user</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">AES-256 end-to-end encryption active</p>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-3 px-md rounded-lg transition-all active:scale-95 flex items-center justify-center space-x-sm shadow-[0_0_20px_rgba(128,131,255,0.2)]" type="submit">
<span>Authorize Access</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Status Activity Log Mock -->
<div class="mt-xl pt-lg border-t border-outline-variant">
<div class="flex justify-between items-center mb-sm">
<span class="font-mono-data text-mono-data text-outline text-xs uppercase tracking-widest">Network Status</span>
<div class="flex items-center space-x-xs">
<div class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></div>
<span class="font-mono-data text-mono-data text-tertiary">Secure</span>
</div>
</div>
</div>
</div>
<!-- Footer Links -->
<div class="mt-lg flex flex-col items-center space-y-md">
<div class="flex space-x-gutter">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Contact Support</a>
</div>
<div class="text-outline/40 font-mono-data text-[10px]">
                    NODE_ID: 882-VG-LOGIN | VERSION 4.2.0-STABLE
                </div>
</div>
</div>
</main>
<!-- Floating Background Graphic (Bento/Modern Element) -->
<div class="hidden lg:block absolute bottom-12 right-12 w-64 h-64 opacity-20 rotate-12">
<div class="grid grid-cols-4 grid-rows-4 gap-2 w-full h-full">
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-primary rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-tertiary rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-primary-container rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
<div class="bg-outline-variant rounded-sm"></div>
</div>
</div>
<script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Interaction State
            btn.disabled = true;
            btn.innerHTML = `
                <span class="animate-spin material-symbols-outlined text-[18px]">progress_activity</span>
                <span>Encrypting...</span>
            `;
            
            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined text-[18px]">check_circle</span>
                    <span>Access Granted</span>
                `;
                btn.classList.replace('bg-primary', 'bg-tertiary');
                btn.classList.replace('text-on-primary', 'text-on-tertiary');
            }, 1500);
        });

        // Password visibility toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">${isPassword ? 'visibility_off' : 'visibility'}</span>`;
        });
    </script>
</body></html>
